name: Build macOS Friends Edition (No License Key)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac-friends:
    name: Build Universal macOS DMG (Friends Free Edition)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run QA BDD Test Suite
        run: npm test

      - name: Inject Friends Free Edition Flavor (No License Required)
        run: |
          echo '{"flavor":"friends-free","freePass":true}' > build-flavor.json
          cat build-flavor.json

      - name: Build Universal macOS Friends DMG
        run: |
          npx electron-builder --mac dmg --universal \
            --config.mac.identity=null \
            --config.afterPack=scripts/after-pack-mac.js \
            --config.mac.artifactName='PhotoAutoCrop-Pro-Mac.${ext}'

      - name: Prepare Simple Install Guide in Dist
        run: |
          cp docs/MAC_FRIENDS_INSTALL_GUIDE.md "dist/給朋友的安裝說明.md"
          ls -lh dist/

      - name: Verify Universal DMG & License-Free Flag
        run: |
          test -f dist/PhotoAutoCrop-Pro-Mac.dmg || (echo "Missing Universal PhotoAutoCrop-Pro-Mac.dmg" && exit 1)
          test -d dist/mac-universal && npx @electron/asar list "dist/mac-universal/PhotoAutoCrop Pro.app/Contents/Resources/app.asar" | grep "build-flavor.json"
          echo "=== Universal macOS Friends Edition Verified ==="

      - name: Upload Friends Mac DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAutoCrop-Pro-Mac-Friends-Test
          path: |
            dist/PhotoAutoCrop-Pro-Mac.dmg
            dist/給朋友的安裝說明.md
          if-no-files-found: error
