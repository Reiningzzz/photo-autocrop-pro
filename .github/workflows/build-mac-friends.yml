name: Build macOS Friends Edition (No License Key)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac-friends:
    name: Build macOS DMG (Friends Free Edition)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run QA BDD Test Suite
        run: npm test

      - name: Inject Friends Free Edition Flavor (No License Required)
        run: |
          echo '{"flavor":"friends-free","freePass":true}' > build-flavor.json
          cat build-flavor.json

      - name: Build macOS Friends DMG (arm64 & x64)
        run: |
          npx electron-builder --mac dmg --arm64 --x64 --config.mac.artifactName='PhotoAutoCrop-Pro-Friends-Mac-${arch}.${ext}'

      - name: Prepare Install Guide in Dist
        run: |
          cp docs/MAC_FRIENDS_INSTALL_GUIDE.md "dist/Mac安裝方法與首次開啟說明.md"
          ls -lh dist/

      - name: Verify macOS Artifacts & License-Free Flag
        run: |
          test -f dist/PhotoAutoCrop-Pro-Friends-Mac-arm64.dmg || (echo "Missing arm64.dmg" && exit 1)
          test -f dist/PhotoAutoCrop-Pro-Friends-Mac-x64.dmg || (echo "Missing x64.dmg" && exit 1)
          # 驗證打包後的 app.asar 內確實包含 build-flavor.json
          test -d dist/mac-arm64 && npx @electron/asar list "dist/mac-arm64/PhotoAutoCrop Pro.app/Contents/Resources/app.asar" | grep "build-flavor.json" || true
          echo "=== macOS Friends Edition DMG Build Verified ==="

      - name: Upload Friends Mac DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAutoCrop-Pro-Mac-Friends-Test
          path: |
            dist/PhotoAutoCrop-Pro-Friends-Mac-*.dmg
            dist/Mac安裝方法與首次開啟說明.md
          if-no-files-found: error
